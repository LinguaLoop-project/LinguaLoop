<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ từ vựng — LinguaLoop Giảng viên</title>
<meta name="description" content="Quản lý bộ từ vựng do Giảng viên tạo.">
<script>(function(){var t=null;try{t=JSON.parse(localStorage.getItem('ll-theme'));}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';document.documentElement.dataset.theme=t;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="teacher.css">
</head>
<body>
<main class="main"><div class="wrap">

  <div class="page-head">
    <div class="overline">Từ vựng</div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <h1>Bộ từ vựng</h1>
      <div class="row g8">
        <button class="btn ghost" id="btnImportCsv"><i class="ph ph-upload-simple"></i>Nhập CSV</button>
        <button class="btn primary" id="btnNewDeck"><i class="ph-fill ph-plus-circle"></i>Tạo bộ từ mới</button>
      </div>
    </div>
    <p class="sub">Bộ từ do bạn tạo được đăng trực tiếp.</p>
  </div>

  <div class="toolbar">
    <div class="search-box grow" style="max-width:300px">
      <i class="ph ph-magnifying-glass"></i>
      <input placeholder="Tìm bộ từ..." id="deckSearch" autocomplete="off">
    </div>
    <div class="seg" id="deckStatus" role="group">
      <button class="on">Tất cả</button>
      <button>Đã đăng</button>
      <button>Nháp</button>
    </div>
    <button class="chip" aria-pressed="false" id="deckOnlyPro"><i class="ph-fill ph-crown-simple"></i>PRO</button>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th class="tbl-check"><input type="checkbox" class="row-check"></th>
        <th>Bộ từ</th><th>Danh mục</th><th>CEFR</th>
        <th style="text-align:center">Số bài</th>
        <th style="text-align:center">Số thẻ</th>
        <th>PRO</th><th>Trạng thái</th><th>Cập nhật</th><th></th>
      </tr></thead>
      <tbody id="deckBody"></tbody>
    </table>
  </div>
  <div class="pagination" id="deckPag"></div>

  <!-- Modal Form Bộ từ -->
  <div class="modal-back" id="modalDeckForm">
    <div class="modal" role="dialog" aria-modal="true" style="width:600px; max-width:90vw; max-height:90vh; display:flex; flex-direction:column;">
      <div class="modal-head" style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="ddfTitle">Thêm bộ từ mới</h2>
        <button class="icon-btn" onclick="closeModal('modalDeckForm')"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body" style="overflow-y:auto;">
        <div class="col g16">
          <div class="field">
            <label>Tên bộ từ (Tiếng Anh) <span class="t-bad">*</span></label>
            <input type="text" id="dfName" placeholder="Vd: TOEIC Essential 1000">
          </div>
          <div class="row">
            <div class="field grow">
              <label>Danh mục</label>
              <select><option>Học thuật (IELTS/TOEFL)</option><option>Công việc & Chuyên ngành</option><option>Giao tiếp cơ bản</option></select>
            </div>
            <div class="field grow">
              <label>Mức độ CEFR</label>
              <select><option>B1</option><option>A1</option><option>A2</option><option>B2</option><option>C1</option><option>C2</option></select>
            </div>
          </div>
          <div class="field">
            <label>Mô tả ngắn</label>
            <textarea rows="2" placeholder="Mô tả bộ từ..."></textarea>
          </div>
          <div class="field row between" style="background:var(--surface-hover);padding:12px;border-radius:var(--radius-md)">
            <div class="col g4">
              <b style="color:var(--text)">Yêu cầu gói PRO</b>
              <span class="small muted">Học viên Free không thể học bộ từ này</span>
            </div>
            <label class="toggle"><input type="checkbox" id="dfPro"><span class="toggle-track"></span></label>
          </div>
          
          <hr style="border:none;border-top:1px solid var(--border);margin:8px 0">
          
          <div class="row between">
            <h3>Danh sách thẻ từ (20)</h3>
            <button class="btn ghost sm" onclick="
              document.getElementById('cfTitle').textContent = 'Thêm thẻ từ';
              document.getElementById('cfWord').value = '';
              document.getElementById('cfDef').value = '';
              document.getElementById('cfTrans').value = '';
              document.getElementById('cfEx').value = '';
              openModal('modalCardForm');
            "><i class="ph ph-plus"></i>Thêm thẻ</button>
          </div>
          <div class="card p0" style="border:1px solid var(--border)">
            <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
              <div><b style="color:var(--primary)">environment</b> <span class="muted">/ɪnˈvaɪrənmənt/</span></div>
              <button class="btn text sm" style="height:auto;padding:0" onclick="
                document.getElementById('cfTitle').textContent = 'Sửa thẻ từ';
                document.getElementById('cfWord').value = 'environment';
                openModal('modalCardForm');
              ">Sửa thẻ</button>
            </div>
            <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
              <div><b style="color:var(--primary)">sustain</b> <span class="muted">/səˈsteɪn/</span></div>
              <button class="btn text sm" style="height:auto;padding:0" onclick="
                document.getElementById('cfTitle').textContent = 'Sửa thẻ từ';
                document.getElementById('cfWord').value = 'sustain';
                openModal('modalCardForm');
              ">Sửa thẻ</button>
            </div>
            <button class="btn ghost sm full">Xem thêm 18 thẻ...</button>
          </div>
        </div>
      </div>
      <div class="modal-foot" style="display:flex; gap:12px; margin-top:auto;">
        <span class="grow"></span>
        <button class="btn ghost" onclick="closeModal('modalDeckForm')">Huỷ</button>
        <button class="btn primary" onclick="closeModal('modalDeckForm');Shell.toast('Đã lưu bộ từ thành công!')"><i class="ph ph-floppy-disk"></i>Lưu bộ từ</button>
      </div>
    </div>
  </div>

  <!-- Modal Form Thẻ từ -->
  <div class="modal-back" id="modalCardForm">
    <div class="modal" role="dialog" aria-modal="true" style="width:500px; max-width:90vw;">
      <div class="modal-head" style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="cfTitle">Thêm thẻ từ</h2>
        <button class="icon-btn" onclick="closeModal('modalCardForm')"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body">
        <div class="col g16">
          <div class="field">
            <label>Từ vựng (Headword) <span class="t-bad">*</span></label>
            <div class="inp-wrap">
              <i class="ic ph ph-magnifying-glass"></i>
              <input type="text" id="cfWord" class="has-ic" placeholder="Tìm từ điển hoặc nhập từ mới...">
            </div>
          </div>
          <div class="field">
            <label>Định nghĩa</label>
            <textarea id="cfDef" rows="2" placeholder="Giải nghĩa..."></textarea>
          </div>
          <div class="field">
            <label>Nghĩa tiếng Việt</label>
            <input type="text" id="cfTrans" placeholder="Nghĩa tiếng Việt...">
          </div>
          <div class="field">
            <label>Câu ví dụ</label>
            <textarea id="cfEx" rows="2" placeholder="Ví dụ sử dụng..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-foot" style="display:flex; gap:12px;">
        <span class="grow"></span>
        <button class="btn ghost" onclick="closeModal('modalCardForm')">Huỷ</button>
        <button class="btn primary" onclick="closeModal('modalCardForm');Shell.toast('Đã lưu thẻ từ!')"><i class="ph ph-check"></i>Lưu thẻ</button>
      </div>
    </div>
  </div>

</div></main>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>
Shell.init('decks');
document.getElementById('btnImportCsv').addEventListener('click', () => Shell.toast('Chức năng nhập CSV sẽ mở dialog'));
document.getElementById('btnNewDeck').addEventListener('click', () => {
  document.getElementById('ddfTitle').textContent = 'Thêm bộ từ mới';
  document.getElementById('dfName').value = '';
  document.getElementById('dfPro').checked = false;
  openModal('modalDeckForm');
});

(function render(){
  document.getElementById('deckBody').innerHTML = DATA.decks.map(d => `
    <tr>
      <td><input type="checkbox" class="row-check"></td>
      <td><div class="bold">${d.name}</div></td>
      <td class="small muted">${d.cat}</td>
      <td><span class="badge cefr ${d.cefr} sm">${d.cefr}</span></td>
      <td style="text-align:center">${d.groups}</td>
      <td style="text-align:center">${d.cards}</td>
      <td>${d.isPro ? '<span class="badge pro sm">PRO</span>' : '—'}</td>
      <td>${Shell.statusBadge(d.status)}</td>
      <td class="small muted">${d.updated}</td>
      <td>
        <div class="tbl-actions">
          <button class="btn text sm" onclick="
            document.getElementById('ddfTitle').textContent = 'Sửa bộ từ';
            document.getElementById('dfName').value = '${d.name}';
            document.getElementById('dfPro').checked = ${d.isPro};
            openModal('modalDeckForm');
          ">Sửa</button>
          <button class="row-menu-btn" style="color:var(--danger)"
            onclick="Shell.confirmDelete('${d.name}', () => Shell.toast('Đã xoá', 'bad'))">
            <i class="ph ph-trash"></i>
          </button>
        </div>
      </td>
    </tr>`).join('');
})();
</script>
</body>
</html>
