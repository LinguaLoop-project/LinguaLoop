spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # ghi âm shadowing tối đa 30 giây ~ 0,94 MB (BR-SHADOW-03)
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # gửi thư đồng bộ trong request đăng ký nên phải chặn treo: tối đa 5 giây mỗi bước
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  cloud:
    openfeign:
      client:
        config:
          default:
            # gọi Google trong request đăng nhập nên phải chặn treo
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # SMTP chỉ ảnh hưởng việc gửi thư, không được làm /health báo DOWN
      enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lingualoop
    access-token-ttl: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    frontend-url: ${FRONTEND_URL}
    mail-from: ${MAIL_FROM}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    oauth-url: https://oauth2.googleapis.com
    user-info-url: https://openidconnect.googleapis.com
  usage:
    # ngày của hạn mức đổi lúc 00:00 theo múi giờ này (BR-SHADOW-01)
    zone: Asia/Ho_Chi_Minh
  azure:
    speech:
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:southeastasia}
