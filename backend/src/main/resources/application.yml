spring:
  # Đọc biến từ file .env (định dạng KEY=VALUE) để dùng được trong ${...} của mọi file yml, khỏi phải đặt
  # từng biến vào IDE hay terminal. Mặc định tìm ./.env (chạy trong backend/) rồi backend/.env (chạy từ
  # thư mục gốc); đặt DOTENV_DIR để chỉ định thư mục khác. Biến môi trường thật của hệ điều hành và tham số
  # dòng lệnh luôn thắng .env. Thiếu file thì bỏ qua (CI, production). File .env bị .gitignore, không commit.
  config:
    import:
      - optional:file:${DOTENV_DIR:.}/.env[.properties]
      - optional:file:${DOTENV_DIR:backend}/.env[.properties]
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # ghi âm shadowing tối đa 30 giây ~ 0,94 MB (BR-SHADOW-03)
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # gửi thư đồng bộ trong request đăng ký nên phải chặn treo: tối đa 5 giây mỗi bước
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  cloud:
    openfeign:
      client:
        config:
          default:
            # gọi Google trong request đăng nhập nên phải chặn treo
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # SMTP chỉ ảnh hưởng việc gửi thư, không được làm /health báo DOWN
      enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lingualoop
    access-token-ttl: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    frontend-url: ${FRONTEND_URL}
    mail-from: ${MAIL_FROM}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    oauth-url: https://oauth2.googleapis.com
    user-info-url: https://openidconnect.googleapis.com
  usage:
    # ngày của hạn mức đổi lúc 00:00 theo múi giờ này (BR-SHADOW-01)
    zone: Asia/Ho_Chi_Minh
  azure:
    speech:
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:southeastasia}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # model văn bản cho Nhận xét AI; đổi bằng GEMINI_TEXT_MODEL khi Google ngừng model này
      text-model: ${GEMINI_TEXT_MODEL:gemini-2.5-flash}
      # model dùng cho lần thử lại khi model chính quá tải (503/429); để trống thì thử lại bằng model chính
      fallback-model: ${GEMINI_FALLBACK_MODEL:}
      timeout: 20s
    gemini-live:
      # model realtime của Phiên gia sư (bản preview, tên có thể đổi); giọng nói tuỳ chọn
      model: ${GEMINI_LIVE_MODEL:gemini-3.1-flash-live-preview}
      voice: ${GEMINI_VOICE:}
  shadowing:
    scoring:
      # circuit breaker quanh lời gọi Azure (BR-SHADOW-09): trong cửa sổ 10 lượt, đủ 5 lượt mà lỗi từ 50% thì mở mạch 30 giây
      window-size: 10
      minimum-calls: 5
      failure-rate-percent: 50
      open-for: 30s
