spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lingualoop
    access-token-ttl: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    frontend-url: ${FRONTEND_URL}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    out-of-order: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
server:
  port: ${PORT:8080}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
