spring:
  # Đọc biến từ file .env (định dạng KEY=VALUE) để dùng được trong ${...} của mọi file yml, khỏi phải đặt
  # từng biến vào IDE hay terminal. Mặc định tìm ./.env (chạy trong backend/) rồi backend/.env (chạy từ
  # thư mục gốc); đặt DOTENV_DIR để chỉ định thư mục khác. Biến môi trường thật của hệ điều hành và tham số
  # dòng lệnh luôn thắng .env. Thiếu file thì bỏ qua (CI, production). File .env bị .gitignore, không commit.
  config:
    import:
      - optional:file:${DOTENV_DIR:.}/.env[.properties]
      - optional:file:${DOTENV_DIR:backend}/.env[.properties]
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # ghi âm shadowing tối đa 30 giây ~ 0,94 MB (BR-SHADOW-03)
      # tệp nhập thẻ Excel/CSV tối đa 2 MB (BR-NT-07); yêu cầu chừa thêm chỗ cho phần đầu multipart
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # gửi thư đồng bộ trong request đăng ký nên phải chặn treo: tối đa 5 giây mỗi bước
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  cloud:
    openfeign:
      client:
        config:
          default:
            # gọi Google trong request đăng nhập nên phải chặn treo
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # SMTP chỉ ảnh hưởng việc gửi thư, không được làm /health báo DOWN
      enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lingualoop
    access-token-ttl: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    frontend-url: ${FRONTEND_URL}
    mail-from: ${MAIL_FROM}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    oauth-url: https://oauth2.googleapis.com
    user-info-url: https://openidconnect.googleapis.com
  audio:
    base-url: ${AUDIO_BASE_URL:}
  credit:
    # ví Free đặt lại lúc 00:00 theo múi giờ này (BR-GA-03)
    zone: Asia/Ho_Chi_Minh
    # credit cố định của một phiên gia sư
    tutor-session-cost: 3
    # credit cố định của một phiên Thực hành với AI theo bài (chế độ giọng nói)
    lesson-chat-cost: 5
  storage:
    s3:
      # Bucket riêng tư; client tải thẳng lên bằng presigned URL. Bucket rỗng thì tải tệp báo STORAGE_UNAVAILABLE.
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-southeast-2}
      # Để trống thì SDK tự tìm credential (IAM role khi deploy).
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      # Chỉ đặt khi dùng MinIO/LocalStack, vd http://localhost:4566
      endpoint: ${AWS_S3_ENDPOINT:}
      # Gốc URL đọc công khai (thư mục được bucket policy cho public, vd vocab-decks/). Trống thì tự suy ra
      # https://<bucket>.s3.<region>.amazonaws.com/; dùng CloudFront thì đặt domain CloudFront vào đây.
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      upload-url-ttl: 5m
      download-url-ttl: 1h
  azure:
    speech:
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:southeastasia}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # model văn bản cho Nhận xét AI; đổi bằng GEMINI_TEXT_MODEL khi Google ngừng model này
      text-model: ${GEMINI_TEXT_MODEL:gemini-3.8-flash}
      # model dùng cho lần thử lại khi model chính quá tải (503/429); để trống thì thử lại bằng model chính
      fallback-model: ${GEMINI_FALLBACK_MODEL:}
      timeout: 20s
    gemini-live:
      # model realtime của Phiên gia sư (bản preview, tên có thể đổi); giọng nói tuỳ chọn
      model: ${GEMINI_LIVE_MODEL:gemini-3.1-flash-live-preview}
      voice: ${GEMINI_VOICE:}
  lesson-import:
    # YouTube Data API v3 (Google Cloud Console > YouTube Data API v3 > Credentials): đọc thời lượng, trạng thái và tiêu
    # đề video khi tạo bài từ link (UC-BH-03). Thiếu thì tạo bài báo "tạm thời không lấy được dữ liệu từ YouTube".
    youtube-api-key: ${YOUTUBE_API_KEY:}
    youtube-api-url: https://www.googleapis.com/youtube/v3
    # lời thoại (Bước 7): phụ đề tiếng Anh của video qua TranscriptAPI (https://transcriptapi.com, ADR 0012), 1 credit
    # TranscriptAPI mỗi lần tạo bài thành công. Thiếu khóa thì tạo bài báo "tạm thời không lấy được lời thoại".
    transcript-api-key: ${TRANSCRIPT_API_KEY:}
    transcript-api-url: https://transcriptapi.com/api/v2
    espeak-path: ${ESPEAK_PATH:espeak-ng}
    espeak-timeout: 30s
    # BR-BH-17
    max-duration: 15m
    translate-batch-size: 20
    # 20 câu thường xong trong ~10s. Hết giờ thì thử lại bằng model dự phòng, nên 2 lần chờ cộng các lô sau phải dưới
    # SUGGEST_TIMEOUT_MS (3 phút) của frontend
    translate-timeout: 30s
    # Gemini gợi ý dịch (UC-BH-10): mức suy nghĩ nội bộ minimal|low|medium|high, rỗng = để model tự quyết. Phải là mức cả
    # model chính lẫn model dự phòng hỗ trợ (gemini-3.8-flash không có minimal); low nhanh, rẻ
    thinking-level: ${GEMINI_THINKING_LEVEL:low}
  shadowing:
    scoring:
      # circuit breaker quanh lời gọi Azure (BR-SHADOW-09): trong cửa sổ 10 lượt, đủ 5 lượt mà lỗi từ 50% thì mở mạch 30 giây
      window-size: 10
      minimum-calls: 5
      failure-rate-percent: 50
      open-for: 30s
      # Bậc F0 chỉ cho 1 yêu cầu nhận dạng đồng thời (không điều chỉnh được, portal không hiển thị); lên S0 thì nâng
      # max-concurrent (mặc định S0 là 100). Lời gọi thừa chờ tối đa queue-wait rồi báo bận (BR-SHADOW-14)
      max-concurrent: 1
      queue-wait: 5s
