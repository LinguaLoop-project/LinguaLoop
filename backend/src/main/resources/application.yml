spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # gửi thư đồng bộ trong request đăng ký nên phải chặn treo: tối đa 5 giây mỗi bước
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # SMTP chỉ ảnh hưởng việc gửi thư, không được làm /health báo DOWN
      enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lingualoop
    access-token-ttl: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    frontend-url: ${FRONTEND_URL}
    mail-from: ${MAIL_FROM}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    out-of-order: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:no-reply@lingualoop.local}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
server:
  port: ${PORT:8080}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
