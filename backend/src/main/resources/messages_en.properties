auth.mail.verify.subject=Verify your LinguaLoop email
auth.mail.verify.body=Hi,\n\nThanks for signing up for LinguaLoop. Open the link below to verify your email:\n\n{0}\n\nThe link is valid for {1} hours and can be used only once.\nIf you did not sign up, you can ignore this email.\n\nLinguaLoop
auth.mail.reset.subject=Reset your LinguaLoop password
auth.mail.reset.body=Hi,\n\nWe received a request to reset the password of your LinguaLoop account. Open the link below to choose a new password:\n\n{0}\n\nThe link is valid for {1} minutes and can be used only once.\nIf you did not ask for this, you can ignore this email and your password stays the same.\n\nLinguaLoop
auth.mail.reset.noPassword.subject=Set a password for your LinguaLoop account
auth.mail.reset.noPassword.body=Hi,\n\nYour LinguaLoop account signs in with Google and has no password yet. Open the link below to set one, then you can sign in with Google or with your email and password:\n\n{0}\n\nThe link is valid for {1} minutes and can be used only once.\nIf you did not ask for this, you can ignore this email.\n\nLinguaLoop
