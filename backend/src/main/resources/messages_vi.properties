auth.mail.verify.subject=Xác thực email LinguaLoop của bạn
auth.mail.verify.body=Chào bạn,\n\nCảm ơn bạn đã đăng ký LinguaLoop. Hãy mở liên kết dưới đây để xác thực email:\n\n{0}\n\nLiên kết có hiệu lực trong {1} giờ và chỉ dùng được một lần.\nNếu bạn không đăng ký, hãy bỏ qua thư này.\n\nLinguaLoop
auth.mail.reset.subject=Đặt lại mật khẩu LinguaLoop
auth.mail.reset.body=Chào bạn,\n\nChúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản LinguaLoop của bạn. Mở liên kết dưới đây để đặt mật khẩu mới:\n\n{0}\n\nLiên kết có hiệu lực trong {1} phút và chỉ dùng được một lần.\nNếu bạn không yêu cầu, hãy bỏ qua thư này, mật khẩu của bạn vẫn giữ nguyên.\n\nLinguaLoop
auth.mail.reset.noPassword.subject=Đặt mật khẩu cho tài khoản LinguaLoop
auth.mail.reset.noPassword.body=Chào bạn,\n\nTài khoản LinguaLoop của bạn đang đăng nhập bằng Google và chưa có mật khẩu. Mở liên kết dưới đây để đặt mật khẩu, sau đó bạn đăng nhập được bằng cả Google lẫn email và mật khẩu:\n\n{0}\n\nLiên kết có hiệu lực trong {1} phút và chỉ dùng được một lần.\nNếu bạn không yêu cầu, hãy bỏ qua thư này.\n\nLinguaLoop
