spring:
  jpa:
    hibernate:
      # TẠM trong lúc chuyển sang schema mới: entity chưa khớp hết với bảng nên
      # chưa validate. Bật lại validate khi mọi entity đã khớp.
      ddl-auto: none
  flyway:
    out-of-order: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  scheduling:
    enabled: false
  jwt:
    secret: test-only-secret-change-me-0123456789-0123456789
  cors:
    allowed-origins: http://localhost:5173
  auth:
    frontend-url: http://localhost:5173
    mail-from: no-reply@lingualoop.test
  google:
    redirect-uri: http://localhost:5173/authenticate
