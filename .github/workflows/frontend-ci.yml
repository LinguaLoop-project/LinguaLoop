# =============================================================================
# LinguaLoop — Frontend CI/CD pipeline
# -----------------------------------------------------------------------------
# Pipeline chia thành 4 job độc lập để đồ thị Actions hiện đủ 4 nút:
#   1 Build -> (2 Lint | 3 Test chạy song song) -> 4 Deploy (Vercel)
# =============================================================================
name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      # Chỉ kích hoạt khi có thay đổi trong frontend/ hoặc chính file này.
      # Tránh chạy pipeline frontend khi chỉ sửa backend.
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền mặc định tối thiểu cho mọi job.
permissions:
  contents: read

env:
  NODE_VERSION: "20"
  WORKING_DIR: frontend

jobs:
  # ===========================================================================
  # JOB 1 — BUILD
  # Mục tiêu: bắt lỗi TypeScript và lỗi build Vite sớm nhất có thể.
  # Nếu job này đỏ thì 2 job sau không cần chạy -> tiết kiệm runner minutes.
  # ===========================================================================
  build:
    name: "1 · Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Cài dependencies (npm ci)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Kiểm tra kiểu TypeScript (tsc --noEmit)
        working-directory: ${{ env.WORKING_DIR }}
        # tsc -b đọc tsconfig.json và biên dịch tất cả project references.
        # --noEmit: chỉ kiểm tra kiểu, không ghi file ra đĩa.
        run: npx tsc -b --noEmit

      - name: Build production (vite build)
        working-directory: ${{ env.WORKING_DIR }}
        env:
          # Truyền biến môi trường vào Vite qua prefix VITE_.
          # Biến này được nhúng vào bundle lúc build, KHÔNG phải runtime.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Tải artifact build
        # Lưu dist/ để job Deploy tái sử dụng mà không cần build lại.
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 1

  # ===========================================================================
  # JOB 2 — LINT & PHÂN TÍCH TĨNH
  # ESLint: kiểm tra code style, best practice React, React Hooks rule.
  # Prettier (tuỳ chọn): kiểm tra định dạng mà không sửa file.
  # ===========================================================================
  lint:
    name: "2 · Lint & phân tích tĩnh"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Cài dependencies (npm ci)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: ESLint
        working-directory: ${{ env.WORKING_DIR }}
        # --max-warnings 0: cảnh báo cũng bị coi là lỗi -> pipeline đỏ.
        # Nếu muốn cho phép cảnh báo thì bỏ flag này.
        run: npx eslint . --max-warnings 0

      - name: Tải báo cáo ESLint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: ${{ env.WORKING_DIR }}/eslint-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # JOB 3 — KIỂM THỬ & COVERAGE
  # Vitest là test runner mặc định cho Vite. Nếu chưa cài, job này bỏ qua
  # thay vì báo lỗi — xem bước "Kiểm tra test framework" bên dưới.
  # Để bật: npm install -D vitest @vitest/coverage-v8
  # ===========================================================================
  test:
    name: "3 · Kiểm thử & coverage"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Cài dependencies (npm ci)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Kiểm tra test framework
        id: check-vitest
        working-directory: ${{ env.WORKING_DIR }}
        # Kiểm tra xem vitest đã được cài chưa. Nếu chưa thì set flag để bỏ qua.
        run: |
          if npm ls vitest --depth=0 > /dev/null 2>&1; then
            echo "has_vitest=true" >> $GITHUB_OUTPUT
          else
            echo "has_vitest=false" >> $GITHUB_OUTPUT
            echo "::notice::Bỏ qua kiểm thử vì chưa cài Vitest. Chạy: npm install -D vitest @vitest/coverage-v8"
          fi

      - name: Chạy test + đo coverage (vitest run --coverage)
        if: steps.check-vitest.outputs.has_vitest == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npx vitest run --coverage

      - name: Tải báo cáo coverage
        if: always() && steps.check-vitest.outputs.has_vitest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # HTML để người đọc, JSON để tích hợp với công cụ khác.
          path: ${{ env.WORKING_DIR }}/coverage/
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # JOB 4 — TRIỂN KHAI VERCEL
  # Chỉ chạy khi CẢ HAI job 2 và 3 xanh -> không bao giờ deploy mã lỗi.
  # - Push lên develop -> deploy Preview (URL tạm thời để review).
  # - Push lên main    -> deploy Production (domain chính thức).
  # - PR               -> deploy Preview và gắn URL vào comment PR.
  # ===========================================================================
  deploy:
    name: "4 · Triển khai Vercel"
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      # pull-requests: write bắt buộc để bot gắn comment URL preview vào PR.
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Cảnh báo khi chưa cấu hình Vercel secrets
        if: |
          env.VERCEL_TOKEN == '' ||
          env.VERCEL_ORG_ID == '' ||
          env.VERCEL_PROJECT_ID == ''
        run: |
          echo "::notice::Bỏ qua deploy vì chưa có secret VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID."

      - name: Checkout mã nguồn
        if: |
          env.VERCEL_TOKEN != '' &&
          env.VERCEL_ORG_ID != '' &&
          env.VERCEL_PROJECT_ID != ''
        uses: actions/checkout@v4

      - name: Cài Node.js ${{ env.NODE_VERSION }}
        if: |
          env.VERCEL_TOKEN != '' &&
          env.VERCEL_ORG_ID != '' &&
          env.VERCEL_PROJECT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cài Vercel CLI
        if: |
          env.VERCEL_TOKEN != '' &&
          env.VERCEL_ORG_ID != '' &&
          env.VERCEL_PROJECT_ID != ''
        # Cài global để dùng lệnh `vercel` trực tiếp trong các bước sau.
        run: npm install -g vercel@latest

      - name: Deploy Preview (PR & develop)
        if: |
          env.VERCEL_TOKEN != '' &&
          env.VERCEL_ORG_ID != '' &&
          env.VERCEL_PROJECT_ID != '' &&
          github.ref != 'refs/heads/main'
        id: deploy-preview
        working-directory: ${{ env.WORKING_DIR }}
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          # Vercel CLI tự đọc VERCEL_ORG_ID và VERCEL_PROJECT_ID từ env vars.
          # --yes: bỏ qua mọi prompt xác nhận.
          # Kết quả là URL preview dạng https://<hash>.vercel.app
          PREVIEW_URL=$(vercel deploy --yes --token=${{ env.VERCEL_TOKEN }})
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"

      - name: Gắn URL preview vào PR
        if: |
          github.event_name == 'pull_request' &&
          steps.deploy-preview.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment\n\n✅ Frontend đã được deploy thành công!\n\n🔗 **URL Preview:** ${{ steps.deploy-preview.outputs.preview_url }}\n\n> Commit: \`${{ github.sha }}\``
            })

      - name: Deploy Production (main)
        if: |
          env.VERCEL_TOKEN != '' &&
          env.VERCEL_ORG_ID != '' &&
          env.VERCEL_PROJECT_ID != '' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          # --prod: deploy lên production alias (domain chính thức).
          # --yes: bỏ qua mọi prompt xác nhận.
          vercel deploy --prod --yes --token=${{ env.VERCEL_TOKEN }}

